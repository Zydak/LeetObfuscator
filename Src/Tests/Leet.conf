# Leet Obfuscator Settings
#(all/none)
# all will mark all functions for parsing automatically and omit only functions with skip annotation
# none will parse only functions that are explicitly marked with forcePass annotation and skip everything else
defaultParseMode=all
# seed for randomness, keep auto unless debugging
runtimeSeed=auto
# minimum instruction count of a function for it to qualify for obfuscation (0 = all qualify)
minFunctionSize=10
# maximum instruction count of a function for it to qualify for obfuscation (0 = all qualify)
maxFunctionSize=0
# minimum instruction count of a block for it to qualify for obfuscation (0 = all qualify)
minBlockSize=5
# maximum instruction count of a block for it to qualify for obfuscation (0 = all qualify)
maxBlockSize=0

# Passes available right now:
# 	- StringEncryptionPass
# 	- MBAPass
# 	- BlockSplitterPass
# 	- DispatcherPass
# 	- AntiAnalysisPass
# 	- AntiAliasingPass
# 	- NanomitesPass
# 	- AAMBAPass
# Each pass needs to be on a separate line. Separate pass parameters with ',' and multi-values with '|'.
passes=
    StringEncryptionPass(),
    MBAPass(expansionCount=2),
    BlockSplitterPass(maxBlockSize=20),
    AntiAnalysisPass(),
    DispatcherPass(),
    MBAPass(expansionCount=1),
    AAMBAPass(),
    AntiAliasingPass(),
    AntiAnalysisPass(),
    NanomitesPass();
